<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temple App Settings</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f4af25",
              "background-light": "#f8f7f5",
              "background-dark": "#221c10",
              "surface-light": "#ffffff",
              "surface-dark": "#332a18",
            },
            fontFamily: {
              "display": ["Work Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased min-h-screen pb-12">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md px-4 py-4 justify-between">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back_ios_new</span>
</button>
<h2 class="text-xl font-semibold leading-tight tracking-tight flex-1 text-center pr-10">Settings</h2>
</div>
<div class="max-w-md mx-auto px-4 mt-2">
<!-- Account Section -->
<div class="mb-6">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 pl-2">Account</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/50 border border-slate-100 dark:border-slate-800">
<!-- Edit Profile -->
<button class="w-full flex items-center gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Edit Profile</p>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Change Password -->
<button class="w-full flex items-center gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">lock</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Change Password</p>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
</div>
<!-- Preferences Section -->
<div class="mb-6">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 pl-2">Preferences</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/50 border border-slate-100 dark:border-slate-800">
<!-- Language -->
<button class="w-full flex items-center gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">language</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Language</p>
<div class="flex items-center gap-2">
<span class="text-sm text-slate-500 dark:text-slate-400">English</span>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</div>
</button>
<!-- Theme -->
<div class="w-full flex items-center gap-4 px-4 py-3">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">palette</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Theme</p>
<!-- Segmented Control -->
<div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg shrink-0">
<button class="py-1 px-3 bg-white dark:bg-slate-600 rounded shadow-sm text-sm font-medium text-slate-900 dark:text-slate-100 transition-all">Light</button>
<button class="py-1 px-3 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 transition-all">Dark</button>
</div>
</div>
</div>
</div>
<!-- Notifications Section -->
<div class="mb-6">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 pl-2">Notifications</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/50 border border-slate-100 dark:border-slate-800">
<!-- Enable Notifications -->
<div class="w-full flex items-center gap-4 px-4 py-3">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">notifications</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Enable Notifications</p>
<div class="w-11 h-6 bg-primary rounded-full relative cursor-pointer">
<div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 shadow-sm transition-transform"></div>
</div>
</div>
<!-- Aarti Reminders -->
<div class="w-full flex items-center gap-4 px-4 py-3">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">self_improvement</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Aarti Reminders</p>
<div class="w-11 h-6 bg-primary rounded-full relative cursor-pointer">
<div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 shadow-sm transition-transform"></div>
</div>
</div>
<!-- Event Updates -->
<div class="w-full flex items-center gap-4 px-4 py-3">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">event</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Event Updates</p>
<div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 rounded-full relative cursor-pointer">
<div class="w-5 h-5 bg-white rounded-full absolute left-0.5 top-0.5 shadow-sm transition-transform"></div>
</div>
</div>
</div>
</div>
<!-- Privacy Section -->
<div class="mb-6">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 pl-2">Privacy</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/50 border border-slate-100 dark:border-slate-800">
<!-- Biometric Login -->
<div class="w-full flex items-center gap-4 px-4 py-3">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">fingerprint</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Biometric Login</p>
<div class="w-11 h-6 bg-primary rounded-full relative cursor-pointer">
<div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 shadow-sm transition-transform"></div>
</div>
</div>
</div>
</div>
<!-- About Section -->
<div class="mb-8">
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 pl-2">About</h3>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/50 border border-slate-100 dark:border-slate-800">
<!-- Terms -->
<button class="w-full flex items-center gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">description</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Terms &amp; Conditions</p>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Privacy Policy -->
<button class="w-full flex items-center gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">policy</span>
</div>
<p class="text-base font-medium flex-1 text-left truncate">Privacy Policy</p>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
</div>
<!-- Logout Button -->
<button class="w-full bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 font-semibold py-4 rounded-xl text-center transition-colors shadow-sm">
            Logout
        </button>
</div>
</body></html>
