<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temple Donation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4af25",
                        "background-light": "#fdfaf4", // Cream-like background
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-primary/20">
<button aria-label="Go back" class="flex size-12 shrink-0 items-center justify-center text-slate-900 dark:text-slate-100 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Donation</h2>
</header>
<main class="flex-1 overflow-y-auto pb-24 @container">
<!-- Hero Banner -->
<section class="@[480px]:px-4 @[480px]:py-4">
<div class="bg-cover bg-center flex flex-col justify-end overflow-hidden @[480px]:rounded-xl min-h-[218px] relative rounded-b-xl @[480px]:rounded-xl mx-0 @[480px]:mx-4" data-alt="Golden lit diya in a temple" style="background-image: linear-gradient(0deg, rgba(34, 28, 16, 0.7) 0%, rgba(34, 28, 16, 0) 50%), url('https://lh3.googleusercontent.com/aida-public/AB6AXuDq0rY5jojtV6FcJefZyxXf-s08zBf7n40sAs45nmmryePiFELtd9WpP5iIBBZ3Mc5CCnMcX5-XdypIi9AC8BuvVTPpsTeHeKRVSckNEYQYIgrzzvtfdequ3LplXs08i1uKEz5PfakMs-PFBPUZnQ4oUGJ-H0J6W8LUvOtDq6Ry5x3ScqsYl7h94nPvB5A-4b03OQLZz_jmgfs5Vg4Yv5rkGWMtQXA3_kkcs6-KS24Cmlt8exmcexrurpjqtsahCbcSTUo4vZ-n8D0');">
<div class="flex p-6 relative z-10">
<p class="text-white text-3xl font-bold leading-tight drop-shadow-md">Support Our Temple</p>
</div>
</div>
</section>
<!-- Impact Message -->
<section class="p-4">
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-white dark:bg-slate-800 p-4 shadow-sm border border-primary/10">
<div class="flex flex-col gap-2 flex-[2_2_0px]">
<p class="text-lg font-bold leading-tight text-primary">Impact of Your Donation</p>
<p class="text-sm font-normal leading-relaxed text-slate-600 dark:text-slate-300">Your generous contributions help in the daily maintenance of the temple, offering annadanam, and supporting community services.</p>
</div>
<div class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-lg flex-1 border border-primary/20" data-alt="Temple priest performing puja" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD4V64AgCe4YIcqAjheVuGHTtu0wrdCj7ZM6E_BbRVeIvAbDSRXF5vSmnztQq2BaHWtUYWFBQJbzqGppDQwpNxVEZvrUhViUT0es86VPP6BAQXY-tchDYaZYTJ73vSv6Kw6ThsMELiMxMNI9LlRwBGwoa6q4vQMNKMao3cDbLAEkt8Z0u9PNdl1NMVidKi2OkZdycQxZz9RU94RbUZfY-IgTWH1KkPOcfKsgRuDLcNNQ3QGQGEMuBFjN_fIHYOlr0mZ17ynpCA3P9Q');">
</div>
</div>
</section>
<!-- Quick Amount -->
<section class="pt-2">
<h3 class="text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-3">Quick Amount</h3>
<div class="flex gap-3 px-4 pb-4 overflow-x-auto no-scrollbar snap-x">
<button class="snap-start flex h-10 shrink-0 items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-primary/30 px-5 shadow-sm hover:border-primary transition-all text-slate-700 dark:text-slate-200">
<span class="text-base font-medium">₹101</span>
</button>
<button class="snap-start flex h-10 shrink-0 items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-primary/30 px-5 shadow-sm hover:border-primary transition-all text-slate-700 dark:text-slate-200">
<span class="text-base font-medium">₹251</span>
</button>
<button class="snap-start flex h-10 shrink-0 items-center justify-center rounded-xl bg-primary px-5 shadow-md shadow-primary/20 text-white border-primary">
<span class="text-base font-bold">₹501</span>
</button>
<button class="snap-start flex h-10 shrink-0 items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-primary/30 px-5 shadow-sm hover:border-primary transition-all text-slate-700 dark:text-slate-200">
<span class="text-base font-medium">₹1001</span>
</button>
<button class="snap-start flex h-10 shrink-0 items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-primary/30 px-5 shadow-sm hover:border-primary transition-all text-slate-700 dark:text-slate-200">
<span class="text-base font-medium">Custom</span>
</button>
</div>
</section>
<!-- Donor Information -->
<section class="p-4 flex flex-col gap-4">
<h3 class="text-lg font-bold leading-tight tracking-[-0.015em] pb-1">Donor Details</h3>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="name">Full Name</label>
<input class="w-full rounded-xl border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-slate-900 dark:text-slate-100 placeholder:text-slate-400" id="name" placeholder="Enter your full name" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="phone">Phone Number</label>
<div class="flex rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<span class="flex items-center px-4 bg-slate-50 dark:bg-slate-700/50 text-slate-500 border-r border-slate-300 dark:border-slate-600 text-sm font-medium">+91</span>
<input class="w-full border-0 bg-transparent px-4 py-3 text-sm outline-none text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-0" id="phone" placeholder="Enter 10-digit number" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email Address <span class="text-slate-400 text-xs font-normal">(Optional for receipt)</span></label>
<input class="w-full rounded-xl border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-slate-900 dark:text-slate-100 placeholder:text-slate-400" id="email" placeholder="Enter email address" type="email"/>
</div>
</section>
<!-- Donation Purpose & Sankalp -->
<section class="p-4 flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="purpose">Donation Purpose</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 pr-10 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-slate-900 dark:text-slate-100" id="purpose">
<option value="general">General Fund</option>
<option value="festival">Upcoming Festival</option>
<option value="prasad">Prasad Distribution</option>
<option value="annadanam">Annadanam</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="sankalp">Sankalp / Prayer Message <span class="text-slate-400 text-xs font-normal">(Optional)</span></label>
<textarea class="w-full rounded-xl border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-slate-900 dark:text-slate-100 placeholder:text-slate-400 resize-none" id="sankalp" placeholder="Write your prayer or family names for blessings..." rows="3"></textarea>
</div>
</section>
<!-- Payment Methods -->
<section class="p-4 mb-8">
<div class="flex items-center gap-2 mb-4">
<h3 class="text-lg font-bold leading-tight tracking-[-0.015em]">Payment Method</h3>
<div class="flex items-center gap-1 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 px-2 py-1 rounded-full text-xs font-semibold ml-auto">
<span class="material-symbols-outlined text-[14px]">lock</span>
                    Secure Payment
                </div>
</div>
<div class="flex flex-col gap-3">
<label class="flex items-center justify-between p-4 rounded-xl border border-primary/30 bg-primary/5 cursor-pointer hover:bg-primary/10 transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-white dark:bg-slate-800 rounded-lg shadow-sm">
<span class="material-symbols-outlined text-primary">qr_code_scanner</span>
</div>
<div>
<p class="text-sm font-bold text-slate-900 dark:text-slate-100">UPI</p>
<p class="text-xs text-slate-500">Google Pay, PhonePe, Paytm</p>
</div>
</div>
<input checked="" class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="payment" type="radio" value="upi"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-slate-50 dark:bg-slate-700 rounded-lg">
<span class="material-symbols-outlined text-slate-500">credit_card</span>
</div>
<div>
<p class="text-sm font-medium text-slate-900 dark:text-slate-100">Credit / Debit Card</p>
<p class="text-xs text-slate-500">Visa, Mastercard, RuPay</p>
</div>
</div>
<input class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="payment" type="radio" value="card"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-slate-50 dark:bg-slate-700 rounded-lg">
<span class="material-symbols-outlined text-slate-500">account_balance</span>
</div>
<div>
<p class="text-sm font-medium text-slate-900 dark:text-slate-100">Net Banking</p>
<p class="text-xs text-slate-500">All Indian banks supported</p>
</div>
</div>
<input class="w-5 h-5 text-primary border-slate-300 focus:ring-primary" name="payment" type="radio" value="netbanking"/>
</label>
</div>
</section>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 p-4 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-50">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-[0.98]">
<span>Proceed to Donate ₹501</span>
<span class="material-symbols-outlined text-xl">favorite</span>
</button>
</div>
</body></html>
