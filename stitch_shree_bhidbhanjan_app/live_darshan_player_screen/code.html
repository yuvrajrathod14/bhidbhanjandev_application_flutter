<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Darshan Player Screen</title>
<!-- Google Fonts: Newsreader for Display -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f4af25",
              "background-light": "#f8f7f5",
              "background-dark": "#221c10",
            },
            fontFamily: {
              "display": ["Newsreader", "serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for chat */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased min-h-screen flex flex-col mx-auto max-w-md shadow-2xl overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center justify-between p-4 sticky top-0 z-20 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl text-slate-800 dark:text-slate-200">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Live Darshan</h1>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-2xl text-slate-800 dark:text-slate-200 cursor-pointer">cast</span>
</div>
</header>
<!-- Live Video Player -->
<section class="relative w-full aspect-video bg-black flex-shrink-0">
<!-- Placeholder for actual live feed -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="Live view of Shree Hanumanji adorned with marigolds" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBAzHBxDnLXwTXFnpEeSNWS_OvO03Y5QXd2INRYFS7RMTuYPkfR05WKjKAch9NePrAfNdZo05u9otnIVYFB8xUttbs-D8mBpZfy7GzlIhTB9QMBdr5wdVqjmkQI5rvn-SVkPsQGMRpINRDa1vkHVfYu9-1rf2zy6TSAzOqfqubLSN44evhZWp2nZ8-w-DFaaUCe-LxY8ohsfXix1GD1ykiX-STuX7yplnuAtb7FqrE9hNQXAxD_jPzMELk4Y1hCZHnRMj3-UZiieMg');">
</div>
<!-- Gradient overlay for better text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>
<!-- Overlays -->
<div class="absolute top-4 left-4 flex items-center gap-2 bg-black/50 backdrop-blur-sm rounded-full px-3 py-1.5 border border-white/10">
<div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>
<span class="text-white text-xs font-bold tracking-widest uppercase">Live</span>
</div>
<div class="absolute top-4 right-4 flex items-center gap-1.5 bg-black/50 backdrop-blur-sm rounded-full px-3 py-1.5 border border-white/10 text-white">
<span class="material-symbols-outlined text-[16px]">group</span>
<span class="text-xs font-bold">1.2k</span>
</div>
<!-- Center Controls (Subtle) -->
<div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity bg-black/20">
<button class="w-16 h-16 rounded-full bg-black/40 backdrop-blur flex items-center justify-center text-white hover:bg-black/60 transition-colors">
<span class="material-symbols-outlined text-4xl">pause</span>
</button>
</div>
</section>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-5 py-6 gap-6 overflow-y-auto">
<!-- Title and Subtitle -->
<div class="flex flex-col gap-1">
<h2 class="text-3xl font-extrabold text-primary drop-shadow-sm">Shree Hanumanji</h2>
<p class="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                Sarangpur Temple, Gujarat
            </p>
</div>
<!-- Action Bar & Donation -->
<div class="flex items-center gap-4">
<div class="flex gap-2">
<button class="flex flex-col items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 hover:bg-primary/20 transition-colors text-slate-700 dark:text-slate-300">
<span class="material-symbols-outlined mb-1 text-primary">notifications_active</span>
<span class="text-[11px] font-bold">Sound</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 hover:bg-primary/20 transition-colors text-slate-700 dark:text-slate-300">
<span class="material-symbols-outlined mb-1 text-primary">share</span>
<span class="text-[11px] font-bold">Share</span>
</button>
</div>
<button class="flex-1 h-16 bg-primary text-background-dark text-lg font-bold rounded-2xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2 transform active:scale-95 transition-transform">
<span class="material-symbols-outlined">volunteer_activism</span>
                Quick Donation
            </button>
</div>
<!-- Prayer Requests Section -->
<div class="flex-1 flex flex-col bg-white/60 dark:bg-black/30 backdrop-blur-md rounded-3xl border border-primary/20 shadow-sm overflow-hidden mt-2">
<div class="px-5 py-4 border-b border-primary/10 flex justify-between items-center bg-white/40 dark:bg-black/20">
<h3 class="font-bold text-lg flex items-center gap-2 text-slate-800 dark:text-slate-200">
<span class="material-symbols-outlined text-primary">folded_hands</span>
                    Live Prayers
                </h3>
<span class="text-xs font-medium text-primary px-2 py-1 bg-primary/10 rounded-full">Auto-scroll on</span>
</div>
<!-- Scrollable Chat List -->
<div class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 scrollbar-hide">
<!-- Message 1 -->
<div class="flex gap-3 items-start animate-fade-in-up">
<div class="w-8 h-8 rounded-full bg-orange-100 dark:bg-orange-900/50 flex items-center justify-center text-xs font-bold text-orange-600 dark:text-orange-400 shrink-0 border border-orange-200 dark:border-orange-800">
                        RP
                    </div>
<div class="flex flex-col gap-0.5">
<span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Rahul P.</span>
<div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 dark:border-slate-700 text-sm">
                            Jai Shree Ram 🙏
                        </div>
</div>
</div>
<!-- Message 2 -->
<div class="flex gap-3 items-start animate-fade-in-up">
<div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-xs font-bold text-blue-600 dark:text-blue-400 shrink-0 border border-blue-200 dark:border-blue-800">
                        SK
                    </div>
<div class="flex flex-col gap-0.5">
<span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Sneha K.</span>
<div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 dark:border-slate-700 text-sm">
                            Om Hanumate Namah 🌺 Bless my family.
                        </div>
</div>
</div>
<!-- Admin Message -->
<div class="flex gap-3 items-start animate-fade-in-up">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shrink-0 shadow-sm shadow-primary/40">
<span class="material-symbols-outlined text-[16px]">campaign</span>
</div>
<div class="flex flex-col gap-0.5 w-full">
<span class="text-[11px] font-bold text-primary">Temple Priest</span>
<div class="bg-primary/10 px-3 py-2 rounded-2xl rounded-tl-none border border-primary/20 text-sm font-medium text-slate-800 dark:text-slate-200">
                            Evening Aarti will begin in 5 minutes.
                        </div>
</div>
</div>
<!-- Message 3 -->
<div class="flex gap-3 items-start animate-fade-in-up">
<div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/50 flex items-center justify-center text-xs font-bold text-green-600 dark:text-green-400 shrink-0 border border-green-200 dark:border-green-800">
                        AJ
                    </div>
<div class="flex flex-col gap-0.5">
<span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Amit J.</span>
<div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 dark:border-slate-700 text-sm">
                            🙏
                        </div>
</div>
</div>
</div>
<!-- Input Area -->
<div class="p-4 bg-white/80 dark:bg-black/40 backdrop-blur border-t border-primary/10">
<div class="flex gap-2 items-center relative">
<button class="absolute left-3 text-slate-400 hover:text-primary transition-colors flex items-center">
<span class="material-symbols-outlined text-[20px]">add_reaction</span>
</button>
<input class="w-full bg-background-light dark:bg-background-dark border border-slate-200 dark:border-slate-700 rounded-full py-3 pl-10 pr-12 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-slate-400" placeholder="Offer a prayer..." type="text"/>
<button class="absolute right-2 w-8 h-8 rounded-full bg-primary text-background-dark flex items-center justify-center shrink-0 shadow-md transform active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[16px]">send</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
