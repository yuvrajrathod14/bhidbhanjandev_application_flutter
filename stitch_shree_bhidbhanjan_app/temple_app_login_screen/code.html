<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temple App Login Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f5993d",
                        "background-light": "#fdfcfb", // Creamier light background
                        "background-dark": "#221910",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl sm:rounded-2xl sm:h-auto sm:min-h-[800px] sm:my-8">
<!-- Top 40%: Branding Area -->
<div class="relative w-full h-64 bg-primary/10 flex flex-col items-center justify-center overflow-hidden rounded-b-3xl shrink-0" data-alt="Subtle mandala decorative background pattern" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDio7YVO5eu_gNcQbcKGhdJuCC2A_B12OPTWB0iwhK8zqsqjFmhKb3KHMO1ohEY4uLlLRuAVDCDEDVJV_tS7KL29zxRAkd-Z9LrtcjtPoHYxQrDxjr-fynGxdIbIxLN2NBvHALr8KbvEaurOlNx-L9Wj-cT09G0ZyGYxLBSeUl7QLa3nzdbOBz9lvh-_zHmp-sWPC2aZbB8wkejGKrvgxaKzLCLW5-1hrXjGca-m_ZjO1wkXbdQyyAuSB_4PRezn-EWPpSIazHDG7g'); background-size: cover; background-position: center;">
<div class="absolute inset-0 bg-background-light/60 dark:bg-background-dark/80 backdrop-blur-[2px]"></div>
<div class="relative z-10 flex flex-col items-center gap-4">
<div class="w-20 h-20 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(245,153,61,0.5)] border-2 border-primary/30">
<span aria-hidden="true" class="material-symbols-outlined text-5xl text-primary">
                        self_improvement
                    </span>
</div>
<div class="text-center">
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white mb-1">Welcome Back</h1>
<p class="text-slate-600 dark:text-slate-400 text-sm italic">Namaste, please login to continue</p>
</div>
</div>
</div>
<!-- Middle 40%: Form Area -->
<div class="flex-1 flex flex-col px-6 py-8 z-10 -mt-4 bg-background-light dark:bg-background-dark rounded-t-3xl">
<form class="flex flex-col gap-5 w-full">
<!-- Email/Phone Input -->
<div class="flex flex-col">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1 ml-1" for="identifier">Email or Phone Number</label>
<div class="relative flex w-full items-stretch rounded-xl border border-primary/30 bg-white dark:bg-slate-900 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors shadow-sm">
<div class="flex items-center pl-4 pr-2 text-primary/70">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-0 border-none bg-transparent h-14 placeholder:text-slate-400 text-base font-normal leading-normal pl-2" id="identifier" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1 ml-1" for="password">Password</label>
<div class="relative flex w-full items-stretch rounded-xl border border-primary/30 bg-white dark:bg-slate-900 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors shadow-sm">
<div class="flex items-center pl-4 pr-2 text-primary/70">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-0 border-none bg-transparent h-14 placeholder:text-slate-400 text-base font-normal leading-normal pl-2" id="password" placeholder="Enter your password" type="password"/>
<button class="flex items-center justify-center pr-4 text-slate-400 hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-sm text-primary font-semibold hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white h-14 rounded-xl font-bold text-lg shadow-[0_4px_14px_0_rgba(245,153,61,0.39)] transition-all mt-4 flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Bottom 20%: Alternative Options -->
<div class="mt-8 flex flex-col gap-6">
<!-- Divider -->
<div class="relative flex items-center">
<div class="flex-grow border-t border-primary/20"></div>
<span class="flex-shrink-0 mx-4 text-sm text-slate-500 dark:text-slate-400 italic">Or continue with</span>
<div class="flex-grow border-t border-primary/20"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4 justify-center">
<button class="flex-1 flex items-center justify-center gap-2 h-12 rounded-xl border border-primary/20 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-primary/5 transition-colors font-medium shadow-sm">
<span class="material-symbols-outlined text-[#DB4437]">mail</span>
                        Google
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 h-12 rounded-xl border border-primary/20 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-primary/5 transition-colors font-medium shadow-sm">
<span class="material-symbols-outlined text-primary">smartphone</span>
                        Phone
                    </button>
</div>
</div>
<!-- Register Link -->
<div class="mt-auto pt-8 pb-4 text-center">
<p class="text-slate-600 dark:text-slate-400">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Register</a>
</p>
</div>
</div>
</div>
</body></html>
